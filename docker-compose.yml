services:
  traefik:
    image: traefik:v3.0
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "443:443"
      - "1473:1473"   # keep old bookmark for absent
      - "9473:9473"   # keep old bookmark for kanjitest
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/acme.json:/letsencrypt/acme.json"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks: [web]
    restart: unless-stopped

  hkabtrak:
    build: ./apps/hkab_trak
    restart: unless-stopped
    env_file:
      - ./hkab_trak.env
    volumes:
      - ./apps/hkab_trak/migrations:/app/migrations
      - ./apps/hkab_trak/instance:/app/instance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.absent.rule=Host(`absent.calgaryhoshuko.org`)"
      # Serve on 443 and 1473 (TLS both)
      - "traefik.http.routers.absent.entrypoints=websecure,legacy_absent"
      - "traefik.http.routers.absent.tls.certresolver=letsencrypt"
      - "traefik.http.services.absent.loadbalancer.server.port=8000"
    networks: [web]

  kanjitest:
    build: ./apps/kanji-test-maker
    restart: unless-stopped
    env_file:
      - ./kanji_test.env
    volumes:
      - ./apps/kanji-test-maker/migrations:/app/migrations
      - ./apps/kanji-test-maker/instance:/app/instance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kanjitest.rule=Host(`kanjisoft.calgaryhoshuko.org`)"
      # Serve on 443 and 9473 (TLS both)
      - "traefik.http.routers.kanjitest.entrypoints=websecure,legacy_kanjitest"
      - "traefik.http.routers.kanjitest.tls.certresolver=letsencrypt"
      - "traefik.http.services.kanjitest.loadbalancer.server.port=8000"
    networks: [web]

networks:
  web: