version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml"
      - "./traefik/acme.json:/letsencrypt/acme.json"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - web

  hkabtrak:
    build: ./hkabtrak
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.absent.rule=Host(`absent.calgaryhoshuko.org`)"
      - "traefik.http.routers.absent.entrypoints=web,websecure"
      - "traefik.http.routers.absent.tls.certresolver=letsencrypt"
      - "traefik.http.services.absent.loadbalancer.server.port=8000"
    networks:
      - web
      -
  kanjitest:
    build: ./kanji-test-maker
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kanjitest.rule=Host(`kanjisoft.calgaryhoshuko.org`)"
      - "traefik.http.routers.kanjitest.entrypoints=web,websecure"
      - "traefik.http.routers.kanjitest.tls.certresolver=letsencrypt"
      - "traefik.http.services.kanjitest.loadbalancer.server.port=8000"
    networks:
      - web

networks:
  web:
    external: false