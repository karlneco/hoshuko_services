version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/acme.json:/letsencrypt/acme.json"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks: [web]
    restart: unless-stopped

  hkabtrak:
    build: ./apps/hkab_trak
    restart: unless-stopped
    # Use your existing env file in $HOME
    env_file:
      - ${HOME}/hkab_trak.env
    # Bind mounts you used before
    volumes:
      - ./apps/hkab_trak/migrations:/app/migrations
      - ./apps/hkab_trak/instance:/app/instance
      # If you still need certbot state (you probably don't with Traefik):
      - letsencrypt:/etc/letsencrypt
      - letsencrypt-lib:/var/lib/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.absent.rule=Host(`absent.calgaryhoshuko.org`)"
      - "traefik.http.routers.absent.entrypoints=web,websecure"
      - "traefik.http.routers.absent.tls.certresolver=letsencrypt"
      - "traefik.http.services.absent.loadbalancer.server.port=8000"
    networks: [web]

  kanjitest:
    build: ./apps/kanji-test-maker
    restart: unless-stopped
    env_file:
      - ${HOME}/kanji_test.env
    volumes:
      - ./apps/kanji-test-maker/migrations:/app/migrations
      - ./apps/kanji-test-maker/instance:/app/instance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kanjitest.rule=Host(`kanjisoft.calgaryhoshuko.org`)"
      - "traefik.http.routers.kanjitest.entrypoints=web,websecure"
      - "traefik.http.routers.kanjitest.tls.certresolver=letsencrypt"
      - "traefik.http.services.kanjitest.loadbalancer.server.port=8000"
    networks: [web]

networks:
  web:

volumes:
  letsencrypt:
  letsencrypt-lib: